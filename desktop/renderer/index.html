<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>BlogDistiller (博萃) · 本地服务未就绪</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
            background: #f7f6f2; color: #111827;
            display: flex; align-items: center; justify-content: center;
            height: 100vh; margin: 0;
        }
        .card {
            text-align: center; max-width: 640px; padding: 44px 52px;
            background: #ffffff; border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .06);
        }
        h1 { font-size: 1.3rem; margin: 0 0 14px; }
        p  { color: #6b7280; font-size: .93rem; line-height: 1.75; margin: 0 0 10px; }
        #detail { color: #b91c1c; font-size: .84rem; word-break: break-all; min-height: 1.3em; }
        #logPath { color: #9ca3af; font-size: .78rem; word-break: break-all; margin-top: 12px; }
        #status { color: #059669; font-weight: 600; min-height: 1.4em; margin-top: 10px; }
        button {
            margin: 16px 6px 0; padding: 10px 28px; border: none; border-radius: 8px;
            background: #059669; color: #fff; font-size: .95rem; cursor: pointer;
        }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        button.ghost { background: #e5e7eb; color: #374151; }
    </style>
</head>
<body>
    <div class="card">
        <h1>⛔ 本地服务未能启动</h1>
        <p>新版工作台由本地 Python 服务驱动。当前服务没有成功启动，<br>
           可能是首次部署未完成、网络受限，或被安全软件拦截。</p>
        <p id="detail"></p>
        <p id="logPath"></p>
        <div id="status"></div>
        <div>
            <button id="retryBtn" onclick="retryStart()">重试启动</button>
            <button id="logBtn" class="ghost" style="display:none" onclick="openLog()">查看启动日志</button>
            <button class="ghost" onclick="window.close()">关闭应用</button>
        </div>
    </div>
    <script>
        var api = window.electronAPI || null;
        var detailEl = document.getElementById('detail');
        var logPathEl = document.getElementById('logPath');
        var logBtn = document.getElementById('logBtn');
        var statusEl = document.getElementById('status');
        var retryBtn = document.getElementById('retryBtn');
        var currentLogPath = '';

        // 展示主进程记录的失败原因与日志位置（若有）
        if (api && api.getLocalServiceStatus) {
            api.getLocalServiceStatus().then(function (st) {
                if (st && st.error) detailEl.textContent = '失败原因：' + st.error;
                if (st && st.logPath) {
                    currentLogPath = st.logPath;
                    logPathEl.textContent = '启动日志：' + st.logPath;
                    logBtn.style.display = 'inline-block';
                }
            }).catch(function () {});
        }

        function openLog() {
            if (currentLogPath && api && api.revealFile) api.revealFile(currentLogPath);
            else if (currentLogPath) api.openExternal('file:///' + currentLogPath.replace(/\\/g, '/'));
        }

        function pollHealth(port, maxSeconds) {
            var waited = 0;
            return new Promise(function (resolve) {
                var timer = setInterval(function () {
                    waited++;
                    fetch('http://127.0.0.1:' + port + '/api/health')
                        .then(function (r) { if (r.ok) { clearInterval(timer); resolve(true); } })
                        .catch(function () {});
                    statusEl.textContent = '正在等待本地服务就绪…（' + waited + ' 秒）';
                    if (waited >= maxSeconds) { clearInterval(timer); resolve(false); }
                }, 1000);
            });
        }

        function retryStart() {
            retryBtn.disabled = true;
            statusEl.textContent = '正在重启本地服务…';
            var begin = null;
            if (api && api.restartLocalService) begin = api.restartLocalService();
            else if (api && api.startLocalService) begin = api.startLocalService();

            Promise.resolve(begin).then(function (st) {
                if (st && st.error) {
                    detailEl.textContent = '失败原因：' + st.error;
                    if (st.logPath) {
                        currentLogPath = st.logPath;
                        logPathEl.textContent = '启动日志：' + st.logPath;
                        logBtn.style.display = 'inline-block';
                    }
                }
                var port = st && st.port;
                if (!port) {
                    statusEl.textContent = '未能获取本地服务端口，请关闭应用后重新打开。';
                    retryBtn.disabled = false;
                    return;
                }
                return pollHealth(port, 120).then(function (ok) {
                    if (ok) {
                        statusEl.textContent = '服务就绪，正在进入新版工作台…';
                        location.href = 'http://127.0.0.1:' + port + '/app?client_mode=1&port=' + port;
                    } else {
                        statusEl.textContent = '等待超时。请关闭应用后重新打开；若反复失败，请检查网络或杀毒软件拦截。';
                        retryBtn.disabled = false;
                    }
                });
            }).catch(function (e) {
                statusEl.textContent = '启动失败：' + (e && e.message ? e.message : e);
                retryBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
