# ============================================================
# BlogDistiller · macOS 版构建流水线
# 作用：在没有 Mac 的情况下，用 GitHub 提供的 macOS 云电脑完成：
#       ① 下载 python-build-standalone 内核 ② electron-builder 出 dmg/zip
#       ③ 用「与客户端完全相同的内核链路」跑一次真实冒烟测试
# 触发：手动 (workflow_dispatch) 或推送 v* 标签时
# 费用：公开仓库的 macOS runner 完全免费；私有仓库按 10 倍时长计费
# 产物：构建结束后在本 run 页面 Artifacts 区下载 mac-arm64 / mac-x64
# ============================================================

name: Build Mac

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: 构建 (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64      # Apple Silicon（M1/M2/M3/M4，当下 Mac 主流）
            ps_arch: aarch64
          - arch: x64        # Intel 老款 Mac
            ps_arch: x86_64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: 安装桌面端依赖
        working-directory: desktop
        run: npm install

      # 内置 Python 内核：python-build-standalone 是 uv 同款的独立 CPython 发行版，
      # 解压后 bin/python3 布局正好被 main.js 的 resolvePython 识别，用户零等待零依赖
      - name: 下载 Python 内核 (python-build-standalone / CPython 3.12.7)
        run: |
          curl -L --fail -o pysa.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20241016/cpython-3.12.7%2B20241016-${{ matrix.ps_arch }}-apple-darwin-install_only.tar.gz"
          mkdir -p pysa_extract desktop/python-mac
          tar -xzf pysa.tar.gz -C pysa_extract
          mv pysa_extract/python/* desktop/python-mac/
          chmod +x desktop/python-mac/bin/*
          ./desktop/python-mac/bin/python3 --version

      # 依赖预装进内置内核：只打解释器不打依赖，用户首启仍要联网 pip，
      # 与 Windows 版同一个病根。装齐后客户端 checkDeps 直接通过，首启零网络。
      - name: 向内核预装后端依赖
        run: |
          ./desktop/python-mac/bin/python3 -m pip install --no-cache-dir \
            -r requirements.txt --disable-pip-version-check \
            -i https://pypi.org/simple
          ./desktop/python-mac/bin/python3 -c \
            "import fastapi,uvicorn,httpx,bs4,markdownify,lxml,docx,jinja2,pydantic,PIL;print('内核依赖自检 OK')"

      - name: 预装并冒烟测试 Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/desktop/browsers-mac
        run: |
          ./desktop/python-mac/bin/python3 -m playwright install chromium
          ./desktop/python-mac/bin/python3 -c \
            "from playwright.sync_api import sync_playwright;p=sync_playwright().start();b=p.chromium.launch(headless=True);print('Chromium 自检 OK:',b.version);b.close();p.stop()"

      # 冒烟测试：直接以「安装包内那一个内核」起服务，与用户首启发生的事完全等价。
      # 早先这里另建 venv 装依赖，测的并不是发布产物真正会走的链路。
      - name: 冒烟测试（与客户端相同的内置内核链路）
        run: |
          set -e
          nohup ./desktop/python-mac/bin/python3 run.py --port 8060 --host 127.0.0.1 --no-reload > smoke.log 2>&1 &
          SMOKE_PID=$!
          OK=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8060/api/health > /dev/null; then OK=1; break; fi
            sleep 2
          done
          if [ "$OK" != "1" ]; then
            echo "---- smoke.log ----"; cat smoke.log
            kill $SMOKE_PID 2>/dev/null || true
            exit 1
          fi
          echo "健康检查通过: $(curl -sf http://127.0.0.1:8060/api/health)"
          echo "平台列表: $(curl -sf http://127.0.0.1:8060/api/platforms | head -c 400)"
          kill $SMOKE_PID 2>/dev/null || true

      - name: 构建 dmg / zip（未签名）
        working-directory: desktop
        run: npx electron-builder --mac --config builder-mac.yml --${{ matrix.arch }} --publish never

      - name: 核验 App 版本与内置资源
        run: |
          APP="$(find dist/mac -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test "$(defaults read "$APP/Contents/Info.plist" CFBundleShortVersionString)" = "1.3.0"
          test -x "$APP/Contents/Resources/python/bin/python3"
          CHROMIUM_DIR="$(find "$APP/Contents/Resources/browsers" -maxdepth 1 -type d -name 'chromium-*' -print -quit)"
          test -n "$CHROMIUM_DIR"
          "$APP/Contents/MacOS/BlogDistiller 文章导出助手" > app-smoke.log 2>&1 &
          APP_PID=$!
          OK=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then OK=1; break; fi
            sleep 2
          done
          if [ "$OK" != "1" ]; then
            cat app-smoke.log
            kill $APP_PID 2>/dev/null || true
            exit 1
          fi
          kill $APP_PID 2>/dev/null || true
          echo "App 真实启动与健康检查通过: $APP"

      - name: 收集构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            dist/mac/*.dmg
            dist/mac/*.zip
          if-no-files-found: error